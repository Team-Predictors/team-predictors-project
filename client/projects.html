<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>INFRA GATI - Projects</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen">

    <nav class="bg-white shadow-sm px-8 py-5">
        <h1 class="text-2xl font-bold text-green-700">
            INFRA GATI
        </h1>
    </nav>

    <main class="max-w-6xl mx-auto px-8 py-12">

        <h2 class="text-4xl font-bold text-gray-900 mb-2">
            Projects
        </h2>

        <p class="text-gray-500 mb-8">
            Monitor infrastructure projects and analyze delay risks.
        </p>

        <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>

    </main>

    <script>

        async function loadProjects() {

            try {

                const response =
                    await fetch("http://127.0.0.1:8000/projects");

                const projects =
                    await response.json();

                const container =
                    document.getElementById("projects-container");

                projects.forEach(project => {

                    const card =
                        document.createElement("div");

                    card.className =
                        "bg-white p-6 rounded-xl shadow-md";

                    card.innerHTML = `
                        <h3 class="text-xl font-bold text-gray-900 mb-4">
                            ${project.project_code}
                        </h3>

                        <p class="text-gray-600">
                            <strong>State:</strong>
                            ${project.state}
                        </p>

                        <p class="text-gray-600">
                            <strong>District:</strong>
                            ${project.district}
                        </p>

                        <p class="text-gray-600">
                            <strong>Project Type:</strong>
                            ${project.project_type}
                        </p>

                        <button
                            onclick="viewProject(${project.id})"
                            class="mt-5 bg-green-700 text-white px-5 py-2 rounded-lg">
                            View Project
                        </button>
                    `;

                    container.appendChild(card);

                });

            } catch (error) {

                console.error(
                    "Failed to load projects:",
                    error
                );

            }

        }

        loadProjects();

        function viewProject(projectId) {
            window.location.href = `project_details.html?id=${projectId}`;
}

    </script>

</body>

</html>
